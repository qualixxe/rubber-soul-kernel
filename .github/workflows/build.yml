name: Build Rubber Soul kernel (courbet)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Kernel source'
        required: false
        default: 'blacksmith'
        type: choice
        options:
          - blacksmith
          - stock

# Rubber Soul kernel for courbet (Mi 11 Lite 4G), MIUI / HyperOS stock ROMs.
# Sources:
#   blacksmith (default): Blacksmithyogi/kernel_xiaomi_courbet @ A15,
#     maintained 4.14.356 tree with courbet_defconfig, dtc-clean.
#   stock: MiCode/Xiaomi_Kernel_OpenSource @ courbet-r-oss (official OSS),
#     needs kernel-patches/stock (delabel generic pinctrl dupes).
# Result is an AnyKernel3 flashable zip.

concurrency:
  group: rubber-soul-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      # LineageOS mirrors on GitHub (googlesource +archive refs are dead):
      # clang 12 r416183b = kernel clang for 4.14/4.19 era
      CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git
      CLANG_BRANCH: lineage-20.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio dwarves python3 git wget curl zip unzip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Resolve source
        run: |
          if [ "${{ inputs.source }}" = "stock" ]; then
            echo "KERNEL_REPO=https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=courbet-r-oss" >> $GITHUB_ENV
            echo "DEFCONFIG=courbet_user_defconfig" >> $GITHUB_ENV
            echo "PATCH_DIR=kernel-patches/stock" >> $GITHUB_ENV
          else
            echo "KERNEL_REPO=https://github.com/Blacksmithyogi/kernel_xiaomi_courbet.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=A15" >> $GITHUB_ENV
            echo "DEFCONFIG=courbet_defconfig" >> $GITHUB_ENV
            echo "PATCH_DIR=kernel-patches/blacksmith" >> $GITHUB_ENV
          fi
          cat $GITHUB_ENV | grep -E "KERNEL|DEFCONFIG|PATCH"

      - name: Clone kernel (shallow, single branch)
        run: |
          git clone --depth 1 --single-branch --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git rev-parse --short HEAD
          test -f arch/arm64/configs/"$DEFCONFIG" || { echo "defconfig $DEFCONFIG missing"; ls arch/arm64/configs/ | head; exit 1; }

      - name: Fetch toolchains
        # NOTE: only clang comes from mirrors now. The 32-bit side uses
        # Ubuntu's gcc-arm-linux-gnueabi: gcc-4.9 era ld produced a vdso32
        # layout that even modern objcopy rejects. The 64-bit side uses
        # Ubuntu binutils via CROSS_COMPILE=aarch64-linux-gnu- (same reason:
        # prebuilt 4.9 objcopy choked on vdso32 too).
        run: |
          git clone --depth 1 --single-branch --branch "$CLANG_BRANCH" "$CLANG_REPO" toolchains/clang
          ./toolchains/clang/bin/clang --version | head -2
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - name: Apply kernel patches
        run: |
          cd kernel
          if compgen -G "$GITHUB_WORKSPACE/$PATCH_DIR/*.patch" > /dev/null; then
            for p in "$GITHUB_WORKSPACE"/$PATCH_DIR/*.patch; do
              echo "applying $p"
              git apply --verbose "$p"
            done
          else
            echo "no patches in $PATCH_DIR"
          fi

      - name: Build
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64 SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          make O=out ARCH=arm64 "$DEFCONFIG"
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-kernel.log"
          echo "--- outputs ---"
          ls -lh out/arch/arm64/boot/
          find out -name "*courbet*.dtbo" -o -name "dtbo.img" | head

      - name: Package AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          IMG=""
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then IMG="Image.gz-dtb";
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then IMG="Image.gz";
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then IMG="Image";
          else echo "no kernel image found"; ls -R kernel/out/arch/arm64/boot/ | head -30; exit 1; fi
          echo "using $IMG"
          cp "kernel/out/arch/arm64/boot/$IMG" ak3/zImage
          sed -i 's/^device.name1=.*/device.name1=courbet/; s/^do.devicecheck=.*/do.devicecheck=1/' ak3/anykernel.sh
          grep -n "^device.name1\|^do.devicecheck" ak3/anykernel.sh
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then cp kernel/out/arch/arm64/boot/dtbo.img ak3/; fi
          cd ak3 && zip -r9 ../rubber-soul-courbet.zip * -x .git/\*
          cd ..
          ls -lh rubber-soul-courbet.zip
          cp "kernel/out/arch/arm64/boot/$IMG" ./kernel-image-"$IMG"
          find kernel/out -name "*courbet*.dtbo" -exec cp {} ./ \; || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubber-soul-courbet
          path: |
            rubber-soul-courbet.zip
            kernel-image-*
            *.dtbo
            build-kernel.log
          if-no-files-found: warn
          retention-days: 30
